name: Update profile stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/update-stats.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats.svg
        run: python3 scripts/generate_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet assets/stats.svg; then
            RM=$(ls | grep -ix 'readme.md' | head -1)
            [ -n "$RM" ] && sed -i -E "s#(assets/stats\.svg)(\?v=[0-9]+)?#\1?v=$(date +%s)#" "$RM"
            git add assets "$RM"
            git commit -m "chore: update profile stats"
            git push
          fi
