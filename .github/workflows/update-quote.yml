name: Update Daily Thought

on:
  schedule:
    - cron: "0 3 * * *"   # once a day at 3:00 UTC (~8:30 AM IST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and insert new quote
        env:
          README_PATH: ReadMe.md
        run: python .github/scripts/generate_quote.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ReadMe.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily thought [skip ci]"
            git push
          fi
