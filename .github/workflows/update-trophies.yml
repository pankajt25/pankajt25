name: Update Trophies

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # daily, staggered after cards + snake
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch trophies SVG (with retries — the free Vercel instance is flaky)
        run: |
          for i in 1 2 3 4 5; do
            curl -sf "https://github-profile-trophy.vercel.app/?username=pankajt25&theme=radical&no-frame=true&column=4&margin-w=10&margin-h=10" -o trophies.svg && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          # Confirm we actually got valid SVG content, not an error page
          head -c 4 trophies.svg | grep -q "<?xml\|<svg" || { echo "Failed to fetch valid trophies SVG after retries"; exit 1; }

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trophies.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update trophies [skip ci]"
            git push
          fi
